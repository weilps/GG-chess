name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses:check
      - run: npm run release:preflight -- --tag v0.1.0
      - name: Validate GitHub workflows
        shell: pwsh
        run: ./scripts/check-workflows.ps1
      - name: Scan tracked history for secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust engine layer
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify Tauri and Rust
        run: npm run tauri build -- --debug --no-bundle
      - name: Build unsigned development NSIS installer
        run: npm run tauri build -- --debug --bundles nsis --config src-tauri/tauri.quality.conf.json
